{% extends "base.html" %}
{% block title %}Enter Amount - Campus Payment System{% endblock %}
{% block content %}
<div class="dashboard-shell payment-shell">
    <div class="content-panel payment-panel">
        <div class="payment-header">
            <p class="eyebrow">Process payment</p>
            <h1>Charge student</h1>
        </div>

        <div class="student-summary payment-summary">
            <div>
                <p class="panel-label">Student</p>
                <h2>{{ student.name }}</h2>
            </div>
            <div class="student-meta">{{ student.student_id }}</div>
        </div>

        <form method="POST" action="{{ url_for('routes.merchant_enter_amount', session_id=session_id) }}" class="amount-form">
            <div class="form-group">
                <label for="amount" class="form-label">Amount (₹)</label>
                <input type="number" step="0.01" min="0.01" max="9999999999.99" class="form-control amount-input" id="amount" name="amount" placeholder="0.00" required autofocus>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            </div>

            <div class="amount-actions">
                <button type="submit" form="cancel-payment" class="btn btn-outline-secondary secondary-button">Cancel</button>
                <button type="submit" class="btn btn-primary primary-button">Charge</button>
            </div>
        </form>

        <form id="cancel-payment" method="POST" action="{{ url_for('routes.cancel_payment_session', session_id=session_id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        </form>
    </div>
</div>
{% endblock %}
