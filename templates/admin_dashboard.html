{% extends "base.html" %}
{% block title %}Admin Dashboard{% endblock %}
{% block content %}
    <div class="dashboard-shell">
        <header class="page-header">
            <div>
                <p class="eyebrow">Admin access</p>
                <h1>Welcome, {{ admin.name }}</h1>
            </div>
            <span class="user-chip user-chip-strong">{{ admin.admin_id }}</span>
        </header>

        <section class="content-panel admin-panel">
            <div class="section-header">
                <h2>Add Balance to Student</h2>
            </div>
            <form method="POST" action="{{ url_for('routes.admin_dashboard') }}" class="admin-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="student_id" class="form-label">Student ID</label>
                    <input type="text" id="student_id" name="student_id" class="form-control" required placeholder="e.g. student1">
                </div>
                <div class="form-group">
                    <label for="amount" class="form-label">Amount to add (₹)</label>
                    <input type="number" id="amount" name="amount" class="form-control" min="0.01" max="9999999999.99" step="0.01" required placeholder="0.00">
                </div>
                <button type="submit" class="btn btn-primary admin-submit">Add balance</button>
            </form>
        </section>
    </div>
{% endblock %}
